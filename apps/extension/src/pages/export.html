<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Echoes export</title>
    <style>
      :root { color-scheme: light dark; --fg:#111; --bg:#fff; --muted:#666; --line:#ddd; --warn:#b42318; --ok:#067647; --skip:#9a6700; --accent:#1f6feb; }
      @media (prefers-color-scheme: dark) { :root { --fg:#eee; --bg:#151515; --muted:#9a9a9a; --line:#333; --warn:#ff8a7a; --ok:#6cd39b; --skip:#e3b341; --accent:#58a6ff; } }
      body { font: 14px/1.5 system-ui, sans-serif; color: var(--fg); background: var(--bg); margin: 0 auto; max-width: 900px; padding: 16px; }
      h1 { font-size: 22px; margin: 0; }
      h2 { font-size: 16px; margin: 0 0 8px; }
      section { border-top: 1px solid var(--line); padding: 14px 0; }
      .muted { color: var(--muted); }
      .small { font-size: 12px; }
      .warn { color: var(--warn); }
      .ok { color: var(--ok); }
      .skip { color: var(--skip); }
      .current { position: sticky; top: 0; z-index: 5; display: flex; flex-direction: column; gap: 2px; margin: 12px 0; padding: 10px 14px; border: 2px solid var(--accent); border-radius: 10px; background: var(--bg); }
      .current strong { font-size: 18px; overflow-wrap: anywhere; }
      .current.none { border-color: var(--line); }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 8px 16px; }
      .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0; }
      .list { max-height: 50vh; overflow: auto; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
      .chat { display: block; padding: 2px 0 2px 22px; overflow-wrap: anywhere; }
      .checks { padding-left: 18px; }
      summary { cursor: pointer; padding: 4px 0; }
      button, select, input { font: inherit; color: inherit; }
      button { padding: 5px 12px; border-radius: 6px; border: 1px solid var(--line); background: transparent; cursor: pointer; }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      button:disabled { opacity: .5; cursor: default; }
      select, input:not([type]), input[type=number], input[type=date] { padding: 3px 6px; border: 1px solid var(--line); border-radius: 6px; background: transparent; }
      progress { width: 50%; vertical-align: middle; }
      footer { border-top: 1px solid var(--line); padding-top: 12px; }
      a { color: var(--accent); }
      .turns { max-height: 60vh; overflow: auto; border: 1px solid var(--line); border-radius: 8px; }
      .turn-row { display: grid; grid-template-columns: auto 4.5em 1fr; gap: 8px; padding: 6px 10px; border-bottom: 1px solid var(--line); align-items: start; }
      .turn-row:last-child { border-bottom: 0; }
      .turn-row.hit { background: color-mix(in srgb, var(--accent) 12%, transparent); }
      .turn-row .text { cursor: pointer; overflow-wrap: anywhere; }
      .turn-row .text:hover .q { text-decoration: underline; }
      .q { font-weight: 600; }
      .badge { display: inline-block; font-size: 11px; border: 1px solid var(--line); border-radius: 10px; padding: 0 6px; margin-right: 4px; color: var(--muted); }
      .rule { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 6px 0; }
      .count { font-variant-numeric: tabular-nums; }
      .overlay { position: fixed; inset: 0; background: rgb(0 0 0 / .45); display: flex; align-items: center; justify-content: center; z-index: 10; }
      .overlay-box { background: var(--bg); width: min(960px, 96vw); height: 92vh; border-radius: 10px; display: flex; flex-direction: column; overflow: hidden; }
      .overlay-box .bar { margin: 0; padding: 8px 12px; border-bottom: 1px solid var(--line); }
      .overlay-box iframe { flex: 1; border: 0; width: 100%; background: #fff; }
      .spacer { flex: 1; }
      kbd { font: 11px ui-monospace, monospace; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
      body { padding-bottom: 34vh; }
      .activity { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; background: var(--bg); border-top: 2px solid var(--line); box-shadow: 0 -4px 16px rgb(0 0 0 / .12); }
      .activity .activity-bar { display: flex; align-items: center; gap: 10px; max-width: 900px; margin: 0 auto; padding: 4px 16px; }
      .activity-bar .link { border: 0; padding: 2px 0; font-weight: 600; }
      .activity-peek { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 12px; }
      .activity-body { max-width: 900px; margin: 0 auto; height: 28vh; overflow: auto; padding: 4px 16px 10px; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
      .activity .entry { display: grid; grid-template-columns: 5.5em minmax(6em, 14em) 1fr; gap: 10px; padding: 3px 0; border-bottom: 1px dashed var(--line); }
      .activity .entry .when { color: var(--muted); }
      .activity .entry .ctx { color: var(--accent); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
      .activity .entry .what { overflow-wrap: anywhere; }
      .activity .entry ul { margin: 2px 0 0; padding-left: 18px; }
      .activity .entry.ok > .what > .icon, .activity li.ok { color: var(--ok); }
      .activity .entry.warn > .what > .icon, .activity li.warn { color: var(--skip); }
      .activity .entry.error > .what, .activity li.error { color: var(--warn); }
      .activity li.info { color: var(--muted); }
      .activity .entry.running { color: var(--muted); }
      .activity.closed { box-shadow: none; }
      .info-button { border: 0; padding: 0 4px; font-size: 16px; line-height: 1; color: var(--accent); }
      .info-box { max-width: min(640px, 92vw); max-height: 85vh; padding: 0; border: 1px solid var(--line); border-radius: 12px; color: var(--fg); background: var(--bg); box-shadow: 0 12px 40px rgb(0 0 0 / .3); }
      .info-box::backdrop { background: rgb(0 0 0 / .45); }
      .info-head { position: sticky; top: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 18px; border-bottom: 1px solid var(--line); background: var(--bg); }
      .info-head h3 { margin: 0; font-size: 17px; }
      .info-body { padding: 4px 18px 16px; line-height: 1.6; }
      .info-body h4 { margin: 16px 0 4px; font-size: 14px; }
      .info-body ol, .info-body ul { padding-left: 22px; margin: 4px 0; }
      .info-body li { margin: 3px 0; }
      .info-body code { font: 12px ui-monospace, monospace; border: 1px solid var(--line); border-radius: 4px; padding: 0 3px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./export/main.tsx"></script>
  </body>
</html>
